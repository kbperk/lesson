<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB PERK | 教室紹介</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blur"></div>

    <div class="app-container">
        <div class="progress-container" id="progress-bar-container"></div>

        <div class="slide-container" id="slide-container">
            <div class="loading-text">教室情報を読み込み中...</div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn prev-btn" onclick="prevSlide()">◀</button>
            <a href="https://kbperk.github.io/main/" class="btn-back">TOPに戻る</a>
            <button class="nav-btn next-btn" onclick="nextSlide()">▶</button>
        </div>
    </div>

    <div id="image-modal" class="modal-overlay" onclick="closeModal()">
        <img id="modal-image" src="" alt="拡大画像">
    </div>

    <script>
        const JSON_URL = "https://kbperk.github.io/lesson/classData.json";
        
        let slidesData = [];
        let currentIndex = 0;

        // 初期データ読み込み
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(JSON_URL + '?v=' + new Date().getTime());
                if (!res.ok) throw new Error("通信エラー");
                const allData = await res.json();
                
                // ▼ 修正箇所：公開設定 かつ 「画像」または「YouTube」が設定されているデータだけを抽出
                slidesData = allData.filter(item => {
                    const isPublic = item.is_public === true;
                    const hasImage = item.image && item.image !== "";
                    const hasYouTube = item.youtube_url && item.youtube_url !== "";
                    
                    // 公開ONで、かつメディア(画像か動画)のどちらかが存在するものだけを残す
                    return isPublic && (hasImage || hasYouTube);
                });
                
                if (slidesData.length === 0) {
                    document.getElementById('slide-container').innerHTML = '<div class="loading-text">現在公開中の情報はありません。</div>';
                    return;
                }
                
                initSlides();
            } catch (err) {
                document.getElementById('slide-container').innerHTML = '<div class="loading-text" style="color:red;">読み込みに失敗しました</div>';
            }
        });

        // スライド UI 初期化
        function initSlides() {
            const progressContainer = document.getElementById('progress-bar-container');
            progressContainer.innerHTML = "";
            
            // 抽出されたデータの数だけプログレスバー（進捗メモリ）を作成
            slidesData.forEach((_, index) => {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';
                const fill = document.createElement('div');
                fill.className = 'progress-fill';
                fill.id = `progress-${index}`;
                segment.appendChild(fill);
                progressContainer.appendChild(segment);
            });
            
            // 左右ボタンの表示・非表示の初期設定（1枚しかない場合はボタンを隠す等の制御用）
            updateNavButtons();
            
            renderSlide(0);
        }

        // URLの強制正規化 (表示エラー防止フェイルセーフ)
        function getSafeEmbedUrl(url) {
            if (!url) return "";
            if (url.includes("youtube.com/embed/")) return url;

            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                return `https://www.youtube.com/embed/${match[2]}?rel=0`;
            }
            return url; 
        }

        // スライド描画処理
        function renderSlide(index) {
            const container = document.getElementById('slide-container');
            const data = slidesData[index];

            let mediaWrapperHtml = '';
            
            // YouTube優先表示ロジック
            if (data.youtube_url && data.youtube_url !== "") {
                const safeUrl = getSafeEmbedUrl(data.youtube_url);
                mediaWrapperHtml = `
                    <div class="media-wrapper">
                        <iframe class="media-content" src="${safeUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>`;
            } else if (data.image && data.image !== "") {
                mediaWrapperHtml = `
                    <div class="media-wrapper">
                        <img class="media-content cursor-zoom" src="${data.image}" alt="${data.title}" onclick="openModal(this.src)">
                    </div>`;
            }

            const html = `
                <div class="slide-content animate-fade">
                    <h2 class="slide-title">${data.title || "無題"}</h2>
                    ${mediaWrapperHtml}
                    <div class="slide-description-area">
                        <div class="slide-description">${data.description.replace(/\n/g, '<br>') || "説明がありません"}</div>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            updateProgressBar(index);
            updateNavButtons();
        }

        // プログレスバー更新処理
        function updateProgressBar(index) {
            slidesData.forEach((_, i) => {
                const fill = document.getElementById(`progress-${i}`);
                if (i < index) fill.style.width = '100%';
                else if (i === index) fill.style.width = '100%';
                else fill.style.width = '0%';
            });
        }

        // ナビゲーションボタン（◀ ▶）の表示制御
        function updateNavButtons() {
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            
            // 最初のスライドなら◀を隠す（または薄くする）
            if (currentIndex === 0) {
                prevBtn.style.visibility = 'hidden';
            } else {
                prevBtn.style.visibility = 'visible';
            }
            
            // 最後のスライドなら▶を隠す
            if (currentIndex === slidesData.length - 1) {
                nextBtn.style.visibility = 'hidden';
            } else {
                nextBtn.style.visibility = 'visible';
            }
        }

        // 次へ進む
        function nextSlide() {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                renderSlide(currentIndex);
            }
        }

        // 前へ戻る
        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide(currentIndex);
            }
        }

        // --- 画像拡大モーダル用関数 ---
        function openModal(imageSrc) {
            document.getElementById('modal-image').src = imageSrc;
            document.getElementById('image-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('image-modal').style.display = 'none';
        }
    </script>
</body>
</html>
